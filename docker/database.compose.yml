name: trajectory-database

services:
  postgres:
    image: mobilitydb/mobilitydb@sha256:8409e3897e2b88561bef4374110c3da5f7ff56838a7745315f1c2f111305dd24
    restart: "no"
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: p7
    command:
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=32MB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - type: bind
        source: /work/P7/pgdata
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    mem_limit: 7g
    shm_size: 1g
