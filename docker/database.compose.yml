name: trajectory-database

services:
  postgres:
    image: mobilitydb/mobilitydb:18-3.6-1.3
    # No auto-restart: on VM boot Docker would start Postgres before UCloud mounts
    # /work/P7, so it would initialise a new, empty cluster on the local disk.
    # Start the database by hand once /work/P7 is mounted (see docker/README.md).
    restart: "no"
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: p7
    command:
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=32MB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - type: bind
        source: /work/P7/pgdata
        target: /var/lib/postgresql
        bind:
          # Fail instead of silently creating an empty data folder if the drive is missing
          create_host_path: false
    mem_limit: 7g
    shm_size: 1g