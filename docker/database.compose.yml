name: trajectory-database

services:
  postgres:
    image: mobilitydb/mobilitydb:18-3.6-1.3
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: p7
    command:
      - -c
      - -shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=32MB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /work/P7/pgdata:/var/lib/postgresql
    mem_limit: 7g
    shm_size: 1g