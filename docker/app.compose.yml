name: trajectory-app

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_BACKEND_API_PATH: http://localhost:8000/api/
    depends_on:
      - backend
    ports:
      - "5173:80"

  postgres:
    image: mobilitydb/mobilitydb:18-3.6-1.3
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: p7
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 1g

volumes:
  pgdata:
