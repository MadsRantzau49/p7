name: trajectory-app

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    network_mode: host
    env_file:
      - ../.env
    environment:
      DATABASE_HOST: localhost
      APP_LOG_DIR: /app/logs
    volumes:
      - ../logs:/app/logs
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_BACKEND_API_PATH: http://localhost:8000/api/
    depends_on:
      - backend
    ports:
      - "5173:80"
