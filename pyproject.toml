[tool.pytest.ini_options]
addopts = ["-q", "-rs", "-m", "not slow and not extra_test"]
pythonpath = [
    "backend/src",
    "backend/tests",
]
testpaths = ["backend/tests"]
markers = [
    "slow: standard offline clustering benchmarks (up to 100,000 subpaths)",
    "extra_test: opt-in million-scale clustering benchmarks (1M, 10M, 100M)",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # import sorting
    "UP",   # modern Python syntax
    "B",    # common bugs / bad practices
    "N",    # Python naming conventions
    "D102", # public methods require docstrings
    "D103", # public functions require docstrings
]

[tool.pyright]
extraPaths = ["backend/src", "backend/tests"]
