<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Trajectory Builder</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="tool">
      <section class="controls">
        <h1>Trajectory builder</h1>

        <p>
          Click the map in travel order. Add and edit as many routes as needed,
          then export them as one CSV fixture.
        </p>

        <div class="route-heading">
          <strong id="route-count">1 route</strong>

          <div class="route-actions">
            <button id="new-route-button" type="button" disabled>
              New route
            </button>
            <button id="delete-route-button" type="button" disabled>
              Delete
            </button>
          </div>
        </div>

        <ol id="route-list" aria-label="Routes"></ol>

        <label for="trajectory-name">CSV trajectory ID / route key</label>
        <input
          id="trajectory-name"
          type="text"
          value="path_south_aalborg"
          pattern="[a-z0-9_-]+"
          maxlength="255"
          title="Use lowercase letters, numbers, underscores, or hyphens"
          required
        />

        <label for="trajectory-id">Trajectory ID (optional)</label>
        <input
          id="trajectory-id"
          type="number"
          min="0"
          step="1"
          placeholder="None"
        />

        <label for="city">City (optional)</label>
        <input
          id="city"
          type="text"
          maxlength="255"
          placeholder="None"
        />

        <label for="source-id">Source ID (optional)</label>
        <input
          id="source-id"
          type="text"
          maxlength="255"
          placeholder="None"
        />

        <label for="vehicle-id">Vehicle ID</label>
        <input
          id="vehicle-id"
          type="number"
          min="0"
          max="2147483647"
          step="1"
          value="0"
          required
        />

        <label for="vehicle-type">Vehicle type</label>
        <select id="vehicle-type" required>
          <option value="UNKNOWN">Unknown</option>
          <option value="CAR">Car</option>
          <option value="TAXI">Taxi</option>
        </select>

        <label for="start-timestamp">Trajectory date / first point time</label>
        <input
          id="start-timestamp"
          type="datetime-local"
          step="1"
          required
        />

        <label for="point-interval">Point interval in seconds</label>
        <input
          id="point-interval"
          type="number"
          min="0.001"
          step="0.001"
          value="15"
          required
        />

        <p class="count">
          <strong id="point-count">0</strong> route points
        </p>

        <ol id="point-list">
          <li>No points yet.</li>
        </ol>

        <div class="buttons">
          <button id="undo-button" type="button" disabled>
            Undo
          </button>

          <button id="clear-button" type="button" disabled>
            Clear
          </button>

          <button
            id="export-button"
            class="primary"
            type="button"
            disabled
          >
            Export CSV
          </button>
        </div>

        <small id="status"></small>
      </section>

      <section class="map-panel">
        <div id="map"></div>
      </section>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="app.js?v=4"></script>
  </body>
</html>
