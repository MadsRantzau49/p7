name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: mobilitydb/mobilitydb:18-3.6-1.3
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p7
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p7"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: p7
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Compile check
        run: python -m compileall -q backend/src backend/tests

      - name: Type check
        run: pyright backend/src backend/tests

      - name: Check unused code
        run: |
          if ! vulture backend/src backend/tests; then
            echo "::warning::Vulture found unused code"
          fi

      - name: Create database schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d p7 -f database/schema.sql

      - name: Test with coverage
        run: |
          pytest --cov=backend/src --cov-report=term-missing

          if ! coverage report --fail-under=100; then
            echo "::warning::Test coverage is below 100%"
          fi