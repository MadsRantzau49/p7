name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Compile check
        run: python -m compileall -q backend/src backend/tests

      - name: Type check
        run: |
          if ! pyright backend/src backend/tests; then
            echo "::warning::Pyright found type errors"
          fi

      - name: Check unused code
        run: |
          if ! vulture backend/src backend/tests; then
            echo "::warning::Vulture found unused code"
          fi

      - name: Test with coverage
        run: |
          pytest --cov=backend/src --cov-report=term-missing

          if ! coverage report --fail-under=80; then
            echo "::warning::Test coverage is below 80%"
          fi